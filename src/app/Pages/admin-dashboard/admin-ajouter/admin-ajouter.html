<div class="modal fade" id="ajouterAdminModal" tabindex="-1" aria-labelledby="ajouterAdminModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow">
      
      <!-- En-tête de la Modal -->
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="ajouterAdminModalLabel">
          <i class="fa-solid fa-user-plus me-2"></i>Ajouter un Administrateur
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>

      <!-- Formulaire -->
      <form (ngSubmit)="onSubmit()">
        <div class="modal-body">
          
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label font-weight-bold">Nom</label>
              <input type="text" class="form-control" [(ngModel)]="nouvelAdmin.nom" name="nom" required placeholder="Ex: Diarra">
            </div>

            <div class="col-md-6">
              <label class="form-label">Prénom</label>
              <input type="text" class="form-control" [(ngModel)]="nouvelAdmin.prenom" name="prenom" required placeholder="Ex: Aminata">
            </div>

            <div class="col-12">
              <label class="form-label">Adresse Email</label>
              <input type="email" class="form-control" [(ngModel)]="nouvelAdministrateur.email" name="email" required placeholder="admin@exemple.com">
            </div>

            <div class="col-12">
              <label class="form-label">Mot de passe</label>
              <input type="password" class="form-control" [(ngModel)]="nouvelAdmin.motDePasse" name="motDePasse" required placeholder="••••••••">
            </div>
          </div>

        </div>

        <!-- Pied de la Modal -->
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" class="btn btn-primary" data-bs-dismiss="modal">Enregistrer</button>
        </div>
      </form>

    </div>
  </div>
</div>

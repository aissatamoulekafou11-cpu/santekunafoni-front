<div class="modal fade" id="ajouterAdminModal">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header  text-dark">

                <h5 class="modal-title">
                    Ajouter un Administrateur
                </h5>

                <button
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <form (ngSubmit)="onSubmit()">

                <div class="modal-body">

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label>Nom</label>

                            <input
                                class="form-control"
                                type="text"
                                [(ngModel)]="nouvelAdmin.nom"
                                name="nom"
                                required>

                        </div>

                        <div class="col-md-6">

                            <label>Prénom</label>

                            <input
                                class="form-control"
                                type="text"
                                [(ngModel)]="nouvelAdmin.prenom"
                                name="prenom"
                                required>

                        </div>

                        <div class="col-md-6">

                            <label>Email</label>

                            <input
                                class="form-control"
                                type="email"
                                [(ngModel)]="nouvelAdmin.email"
                                name="email"
                                required>

                        </div>

                        <div class="col-md-6">

                            <label>Mot de Passe</label>

                            <input
                                class="form-control"
                                type="password"
                                [(ngModel)]="nouvelAdmin.motpass"
                                name="motpass"
                                required>

                        </div>

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-outline-secondary "
                        data-bs-dismiss="modal">

                        Annuler

                    </button>

                    <button
                        type="submit"
                        class="btn btn-custom">

                        Enregistrer

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

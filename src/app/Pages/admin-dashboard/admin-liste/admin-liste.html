<div class="container mb-2 text-center">


        <h2 >Liste des administrateurs</h2>
        
    </div>
    

    <table class="table  table-hover">

        <thead class="table-white">

            <tr>

                <th>Nom</th>
                <th>Prénom</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Rôle</th>
                <th class="text-center">Actions</th>

            </tr>

        </thead>

        <tbody>

            <tr *ngFor="let admin of administrateurs">

                <td>{{admin.nom}}</td>
                <td>{{admin.prenom}}</td>
                <td>{{admin.email}}</td>
                <td>{{admin.tel}}</td>
                <td>{{admin.role}}</td>

                <td class="text-center">
                 <button 
                 class="btn p-0 border-0 bg-transparent text-action-green p-3"
                 (click)="openEditModal(admin)"
                  title="Modifier">

                 <i class="fa-solid fa-pencil"></i>

                 </button>
                  <button 
                  class="btn p-0 border-0 bg-transparent text-danger p-3"
                    (click)="openDeleteModal(admin)"
                    title="Supprimer">

                    <svg xmlns="http://www.w3.org/2000/svg"
                        width="20"
                           height="20"
                           fill="none"
                         stroke="currentColor"
                        stroke-width="2"
                         viewBox="0 0 24 24">

                     <polyline points="3 6 5 6 21 6"></polyline>
                     <path d="M19 6v14a2 2 0 0 1-2 2H7
                         a2 2 0 0 1-2-2V6
                         m3 0V4a2 2 0 0 1 2-2h4
                         a2 2 0 0 1 2 2v2"></path>

                     <line x1="10" y1="11" x2="10" y2="17"></line>
                          <line x1="14" y1="11" x2="14" y2="17"></line>

                            </svg>

                 </button>

                    

                </td>

            </tr>

        </tbody>

    </table>
